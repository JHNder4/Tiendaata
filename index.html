@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.flt{background:#fbfaf8}}

.gal{position:relative}.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;background:var(--sf)}.track::-webkit-scrollbar{display:none}

.gb:hover{background:#fff}.gb.l{left:10px}.gb.r{right:10px}

.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}

.th button:hover{border-color:var(--fg)}.th img{width:100%;height:100%;object-fit:contain}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

.sz:hover:not(:disabled){border-color:var(--fg)}.sz:active:not(:disabled){transform:scale(.96)}
.sz.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.sz:disabled{color:#aaa;background:var(--sf);text-decoration:line-through;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.mu{color:var(--mu)}
.note{background:#fff8e1;border:1px solid #ecd58a;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}td input[type=number]{width:80px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.ci img{width:56px;height:70px;object-fit:contain;background:var(--sf);border-radius:8px}.ci>div{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:6px;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-brd);border-radius:14px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabs{background:#fbfaf8}}
.tabs a{padding:7px 14px;border-radius:9px;text-decoration:none;border:1px solid transparent;transition:background .15s}
.tabs a:hover{background:rgba(29,29,27,.06)}.tabs a.on{background:var(--fg);color:#fff}
.tag{font-size:12px;border:1px solid #bbb;border-radius:4px;padding:1px 7px;margin-right:4px}.tag.r{color:var(--rd);border-color:var(--rd)}
.thm{width:48px;height:60px;object-fit:contain;background:var(--sf);border-radius:6px}
section.f{border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0;background:#fff}
.dz{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px dashed #bbb;border-radius:12px;padding:12px;transition:background .15s,border-color .15s}
.dz.o{background:var(--glass);border-color:var(--fg)}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.tn{position:relative;border:1px solid var(--ln);border-radius:8px;padding:4px}
.tn img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--sf);border-radius:4px}
.nm{position:absolute;top:6px;left:6px;background:var(--fg);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;z-index:1}
.tn i{position:absolute;top:6px;right:6px;background:var(--glass-strong);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-brd);border-radius:4px;font-size:11px;padding:0 5px;font-style:normal}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tn i{background:#fff}}
.tn .ac{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.tn .ac button{font-size:12px;padding:2px 6px;border:1px solid #bbb;background:#fff;border-radius:6px;cursor:pointer}
.bar{position:sticky;bottom:0;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border-top:1px solid var(--glass-brd);box-shadow:0 -10px 24px -18px rgba(29,29,27,.3);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;margin:0 -16px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bar{background:#fbfaf8}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--glass-dark);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);color:#fff;padding:9px 16px;border-radius:12px;z-index:99;max-width:90%;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.toast{background:var(--fg)}}

.phone{width:375px;max-width:100%;background:#fff;border-radius:22px;padding:16px;border:8px solid #222;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}

.ahd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}.ahd a{color:var(--mu);font-size:13px;text-decoration:none}.ahd a:hover{text-decoration:underline}
span.bad{background:rgba(29,29,27,.08);border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.low{border-color:var(--rd)!important}
	@media(max-width:700px){table{display:block;overflow-x:auto}}

/* Tienda Ata — first visual pass: warm boutique surfaces, with glass reserved for controls. */
:root{
  --fg:#252720;--mu:#6d7067;--ln:rgba(43,48,38,.14);--sf:#efeee8;--rd:#a34338;
  --olive:#66735a;--glass:rgba(249,248,243,.78);--glass-strong:rgba(255,255,252,.86);
  --glass-brd:rgba(57,66,47,.14);--glass-hi:rgba(255,255,255,.72);--glass-dark:rgba(35,38,31,.88);
  --blur:14px;--ease:cubic-bezier(.2,.7,.2,1)
}
html{background:radial-gradient(ellipse at 50% -24%,#fff 0,#f8f7f2 40%,#f1f0e9 100%);background-attachment:fixed}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
.wrap{max-width:1160px;padding:12px 20px 64px}
.hd{margin:0 -20px 24px;padding:12px 20px;background:var(--glass);border:1px solid var(--glass-brd);border-top:0;border-radius:0 0 18px 18px;box-shadow:0 1px 0 var(--glass-hi) inset,0 12px 28px -24px rgba(35,38,31,.42);backdrop-filter:blur(var(--blur)) saturate(145%);-webkit-backdrop-filter:blur(var(--blur)) saturate(145%)}
.brand{display:flex;align-items:center;min-height:44px;color:var(--fg);font-size:18px;font-weight:700;letter-spacing:-.045em;white-space:nowrap}
.hd nav{gap:5px}
.hd nav a{display:inline-flex;align-items:center;min-height:44px;padding:7px 13px;border:1px solid transparent;border-radius:999px;text-decoration:none;transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
.hd nav a:hover{background:rgba(255,255,255,.62);border-color:var(--glass-brd);color:var(--fg)}
.hd nav a:active{transform:scale(.97)}
h1{font-size:clamp(25px,3vw,32px);line-height:1.15;letter-spacing:-.04em;margin:10px 0 18px}
h2{font-size:20px;line-height:1.25;letter-spacing:-.025em;margin:30px 0 13px}
h3{letter-spacing:-.015em}
.srch{max-width:740px;align-items:center;padding:6px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;box-shadow:0 1px 0 var(--glass-hi) inset,0 10px 24px -22px rgba(35,38,31,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.srch input{min-height:44px;border:1px solid transparent;background:transparent;padding:9px 12px}
.srch input:focus{border-color:var(--glass-brd);box-shadow:0 0 0 3px rgba(102,115,90,.13)}
.btn{min-height:44px;border-radius:12px;background:var(--fg);border-color:var(--fg);font-weight:600;transition:transform .14s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.btn:hover{box-shadow:0 7px 18px -11px rgba(35,38,31,.75);background:#34382f}
.btn:active{transform:scale(.975)}
.btn.s{background:var(--glass-strong);border-color:var(--glass-brd);box-shadow:0 1px 0 var(--glass-hi) inset;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.s:hover{background:#fff}
.btn.d{color:var(--rd);border-color:rgba(163,67,56,.42);background:rgba(255,255,255,.82)}
.btn.sm{min-height:36px;border-radius:10px}
input,select,textarea{border-color:rgba(43,48,38,.22);border-radius:11px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(102,115,90,.14)}
.chips{gap:9px}
.chips a{display:inline-flex;align-items:center;min-height:40px;padding:7px 15px;border-color:var(--glass-brd);border-radius:999px;background:var(--glass-strong);box-shadow:0 1px 0 var(--glass-hi) inset;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:transform .14s var(--ease),background .16s var(--ease),border-color .16s var(--ease)}
.chips a:hover{background:#fff;border-color:rgba(102,115,90,.28)}
.chips a:active{transform:scale(.97)}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,205px),1fr));gap:22px 18px}
.card{border-radius:16px;color:var(--fg);transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:0 13px 26px -24px rgba(35,38,31,.5)}
.card img,.card .ph{aspect-ratio:4/5;border-radius:16px;background:#eeede7}
.card b{margin-top:10px;font-size:15px;line-height:1.35}
.card>span{display:inline-block;margin-top:3px;font-variant-numeric:tabular-nums}
.card em{top:10px;left:10px;padding:4px 9px;border-color:var(--glass-brd);border-radius:999px;background:var(--glass-strong);font-weight:600}
.old{color:#77796f;font-size:12px}
.ph{border:1px solid rgba(43,48,38,.06);color:#6b6c65}
.flt{padding:16px;background:var(--glass);border-color:var(--glass-brd);border-radius:18px;box-shadow:0 1px 0 var(--glass-hi) inset,0 12px 24px -24px rgba(35,38,31,.48);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.flt label{font-size:12px;font-weight:600;color:#66695f}
.pd{gap:clamp(20px,4vw,48px)}
.track{border:1px solid rgba(43,48,38,.08);border-radius:18px;background:#eeede7}
.sl{aspect-ratio:4/5}
.gb,.cnt{border:1px solid var(--glass-brd);background:var(--glass-strong);box-shadow:0 2px 9px -5px rgba(35,38,31,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gb{min-height:42px;border-radius:12px}
.cnt{padding:4px 10px;border-radius:999px;font-weight:600}
.th button,.sz{border-radius:11px;transition:transform .14s var(--ease),border-color .15s var(--ease),background .15s var(--ease)}
.sz{min-height:44px;border-color:rgba(43,48,38,.22)}
.sz.on{background:var(--olive);border-color:var(--olive)}
.sz:disabled{opacity:.65}
.acts{gap:10px}
.ci{gap:14px;padding:14px 0;border-color:var(--ln)}
.ci img{border-radius:11px;background:var(--sf)}
.tabs{gap:7px;padding:7px;background:var(--glass);border-color:var(--glass-brd);border-radius:16px;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.tabs a{min-height:42px;display:inline-flex;align-items:center;padding:7px 15px;border-radius:11px}
.tabs a.on{background:var(--fg)}
section.f{border-color:var(--glass-brd);border-radius:16px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
.dz{border-color:rgba(43,48,38,.22);border-radius:14px}
.tn{border-color:var(--ln);border-radius:12px;background:#fff}
.bar{background:var(--glass);border-color:var(--glass-brd);backdrop-filter:blur(var(--blur)) saturate(145%);-webkit-backdrop-filter:blur(var(--blur)) saturate(145%)}
.toast{background:var(--glass-dark);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modal{background:rgba(34,36,30,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.phone{border:1px solid var(--glass-brd);border-radius:24px;box-shadow:0 26px 70px -36px rgba(0,0,0,.55)}
.pf{border-color:var(--ln)}
.note{border-radius:12px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hd,.srch,.flt,.tabs,.bar{background:#f8f7f2}
  .chips a,.btn.s,.gb,.cnt,.card em{background:#fff}
}
@media(prefers-reduced-transparency:reduce){
  .hd,.srch,.flt,.tabs,.bar{background:#f8f7f2}
  .chips a,.btn.s,.gb,.cnt,.card em{background:#fff}
}
@media(max-width:700px){
  .wrap{padding:8px 14px 48px}
  .hd{margin:0 -14px 20px;padding:8px 14px;border-radius:0 0 15px 15px}
  .hd nav{gap:2px}
  .hd nav a{padding:6px 9px;font-size:13px}
  .brand{font-size:17px}
  h2{margin-top:25px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .card img,.card .ph{border-radius:13px}
  .flt{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
  .srch{gap:4px}
  .srch .btn{padding:9px 12px}
  .bar{padding:10px 14px;margin:0 -14px}
  .ci{gap:10px}
  .btn.sm{min-height:40px}
}
@media(max-width:380px){
  .hd nav a{padding:6px 7px;font-size:12px}
  .brand{font-size:16px}
  .grid{gap:16px 10px}
}

/* Tienda Ata — dark premium responsive pass */
:root{--fg:#f2f0ea;--mu:#a6a79f;--ln:rgba(255,255,255,.10);--sf:#1b1d1a;--rd:#d35a4d;--olive:#879775;--glass:rgba(25,27,24,.78);--glass-strong:rgba(31,34,30,.90);--glass-brd:rgba(255,255,255,.11);--glass-hi:rgba(255,255,255,.06);--glass-dark:rgba(12,14,12,.94);--blur:18px}
html{background:radial-gradient(circle at 50% -15%,rgba(112,128,91,.16),transparent 38%),linear-gradient(180deg,#101210 0%,#151714 48%,#0d0f0d 100%);background-attachment:fixed}

/* Tienda Ata — Apple-inspired final UI: quiet chrome, generous space, layered surfaces */
:root{
  --fg:#f5f5f7;--mu:#a1a1a6;--ln:rgba(255,255,255,.10);--sf:#1d1d1f;--rd:#ff453a;
  --olive:#9aa88d;--glass:rgba(29,29,31,.72);--glass-strong:rgba(44,44,46,.88);--glass-brd:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.06);--blur:24px
}
html{background:#000;background-attachment:fixed}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;background:radial-gradient(ellipse at 50% -12%,#252525 0,#111 34%,#000 78%);color:var(--fg)}

.btn.s{background:#2c2c2e;color:#f5f5f7;border:1px solid rgba(255,255,255,.12)}.btn.s:hover{background:#3a3a3c}.btn.d{background:rgba(255,69,58,.12);color:#ff6961;border-color:rgba(255,69,58,.3)}

/* Apple-inspired footer / brand signature */
.pf{max-width:1280px;margin:64px auto 0;padding:28px 0 12px;text-align:center;color:#8e8e93}
.pf-links{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.pf a{color:#a1a1a6;font-size:12px;text-decoration:none}.pf a:hover{color:#f5f5f7;text-decoration:none}
.top-btn{appearance:none;border:0;background:transparent;color:#a1a1a6;font:inherit;font-size:12px;cursor:pointer;padding:4px 7px;border-radius:8px}.top-btn:hover{color:#f5f5f7;background:rgba(255,255,255,.06)}
.copyright{padding-top:16px;font-size:11px;letter-spacing:.01em;color:#6e6e73}.copyright strong{color:#a1a1a6;font-weight:600}
@media(max-width:600px){.pf{margin-top:48px;padding-top:24px}.pf-links{gap:12px}.copyright{font-size:10px}}


/* Promotions */
.promo-banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 30px}
.promo-banner>div{padding:22px 24px;border:1px solid rgba(255,255,255,.10);border-radius:22px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:0 18px 45px -34px #000}
.promo-banner span,.promo-badge,.tag{display:inline-flex;align-items:center;width:max-content;padding:4px 9px;border-radius:999px;background:#2c2c2e;color:#f5f5f7;font-size:11px;font-weight:600}
.promo-banner strong{display:block;margin-top:10px;font-size:22px;letter-spacing:-.03em}
.promo-banner p{margin:5px 0 0;color:#a1a1a6}
.promo-badge{margin-left:7px;vertical-align:middle;background:rgba(255,69,58,.14);color:#ff6961;border:1px solid rgba(255,69,58,.20)}
.promo-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.promo-row:last-child{border-bottom:0}.promo-row strong{font-size:16px}
@media(max-width:600px){.promo-banner{grid-template-columns:1fr}.promo-banner>div{padding:18px}.promo-row{align-items:flex-start;flex-direction:column}.promo-row .row{width:100%}}

/* Related products — Apple-style recommendation rail */
.related-products{margin-top:88px;padding-top:12px}
.related-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px}
.related-head span{display:block;color:#8e8e93;font-size:11px;font-weight:600;letter-spacing:.12em;margin-bottom:8px}
.related-head h2{margin:0;font-size:clamp(28px,4vw,42px)}
.related-head>a{color:#a1a1a6;text-decoration:none;font-size:13px;white-space:nowrap}.related-head>a:hover{color:#fff}
.related-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.related-card{display:block;color:#f5f5f7;text-decoration:none;min-width:0}
.related-card>img,.related-card>.ph{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#171719;border:1px solid rgba(255,255,255,.07);border-radius:18px;transition:transform .18s ease,box-shadow .18s ease}
.related-card:hover>img,.related-card:hover>.ph{transform:translateY(-3px);box-shadow:0 18px 35px -28px #000}
.related-info{padding-top:12px}.related-info b{display:block;font-size:14px;font-weight:600;line-height:1.35}.related-info span{display:block;margin-top:4px;color:#a1a1a6;font-size:13px}
@media(max-width:900px){.related-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.related-products{margin-top:62px}.related-head{align-items:flex-start}.related-head h2{font-size:27px}.related-head>a{padding-top:20px}.related-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 11px}.related-card>img,.related-card>.ph{border-radius:14px}.related-info{padding-top:9px}.related-info b{font-size:13px}}

/* Modo claro / oscuro — preferencia persistente */

body.light-mode .card em,body.light-mode .gb,body.light-mode .cnt{background:rgba(255,255,255,.82);color:#1d1d1f;border-color:rgba(0,0,0,.10)}body.light-mode .old,body.light-mode .mu{color:#6e6e73}

body.light-mode .tabs a{color:#6e6e73}body.light-mode .tabs a.on{background:#e5e5ea;color:#1d1d1f}

.theme-toggle:hover{background:#3a3a3c}.theme-toggle:active{transform:scale(.94)}

/* Imágenes de productos — encuadre consistente y sin deformaciones */
.card > img,.card > .ph,.related-card > img,.related-card > .ph,.tn > img,.tn > .ph,.ci > img,.ci > .ph{
  width:100%;
  aspect-ratio:1/1;
  object-fit:contain;
  object-position:center;
  display:block;
  overflow:hidden;
}
.card > img,.related-card > img,.tn > img,.ci > img{background:#f5f5f7;}
.card > .ph,.related-card > .ph,.tn > .ph,.ci > .ph{display:flex;align-items:center;justify-content:center;background:#171719;}
/* La foto principal conserva proporciones; el contenedor siempre tiene el mismo marco */
.pd .track .sl{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#171719;border-radius:22px;}
.pd .track .sl > img,.pd .track .sl > .ph{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;display:block;}
.pd .track .sl > img{background:#171719;}
/* Miniaturas */
.th button{overflow:hidden;}
.th button img,.th button .ph{width:100%;height:100%;object-fit:contain;object-position:center;display:block;}
/* Evita que fotos verticales u horizontales rompan las tarjetas */
.card img,.related-card img,.tn img,.ci img{max-width:100%;height:auto;}
body.light-mode .card > img,body.light-mode .related-card > img,body.light-mode .tn > img,body.light-mode .ci > img,
body.light-mode .pd .track .sl,body.light-mode .pd .track .sl > img{background:#f2f2f7;}

      const cfg=await fetch('/api/clerk-config',{credentials:'same-origin'}).then(r=>r.ok?r.json():Promise.reject(new Error('Clerk config unavailable')));

<script src="/app.js" defer></script><script defer>
/* Tienda Ata — productos relacionados en detalle */
(function(){
  const SUPABASE_URL='https://svvylvtmmynxkmdowymx.supabase.co';
  const SUPABASE_KEY='sb_publishable_RYbyrmTxY4Qv2rKTuxeT6Q_70Juauak';
  let cache=null, loading=false;
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);
  const money=(v)=>'$'+Number(v||0).toLocaleString('es-MX')+' MXN';
  const img=(src,name)=>{
    const url=String(src||'');
    return /^https:\/\//i.test(url)
      ? '<img src="'+esc(url)+'" alt="'+esc(name)+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'ph\',textContent:\'Sin foto\'}))">'
      : '<div class="ph">Sin foto</div>';
  };
  async function products(){
    if(cache) return cache;
    if(loading) return [];
    loading=true;
    try{
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
      const {data,error}=await client.from('products').select('id,data,is_demo,created_at').order('created_at',{ascending:false});
      if(error) throw error;
      cache=(data||[]).filter(r=>r.data&&typeof r.data==='object'&&r.data.status==='published').map(r=>({...r.data,id:r.id}));
      return cache;
    }catch(e){console.warn('No se pudieron cargar productos relacionados:',e);return []}
    finally{loading=false}
  }
  function card(p){
    return '<a class="related-card" href="#/producto/'+encodeURIComponent(p.id)+'">'+img((p.photos||[])[0],p.name||'Producto')+
      '<div class="related-info"><b>'+esc(p.name||'Producto')+'</b><span>'+money(p.price)+'</span></div></a>';
  }
  async function mount(){
    if(!location.hash.startsWith('#/producto/')) return;
    const host=document.querySelector('.pd');
    if(!host||host.querySelector('.related-products')) return;
    const id=decodeURIComponent(location.hash.slice('#/producto/'.length).split('?')[0]);
    const list=await products();
    const current=list.find(p=>p.id===id);
    if(!current) return;
    const others=list.filter(p=>p.id!==id);
    const scored=others.map(p=>{
      let score=0;
      if(current.cat&&p.cat===current.cat) score+=5;
      if(current.brand&&p.brand&&p.brand===current.brand) score+=4;
      if(current.sizes&&p.sizes) score+=1;
      if(Number(p.stock||0)>0 || Object.values(p.sizes||{}).some(n=>Number(n)>0)) score+=1;
      return {p,score};
    }).sort((a,b)=>b.score-a.score||String(a.p.name).localeCompare(String(b.p.name))).slice(0,8).map(x=>x.p);
    if(!scored.length) return;
    const section=document.createElement('section');
    section.className='related-products';
    const title=current.cat ? 'También te puede gustar' : 'Más productos';
    section.innerHTML='<div class="related-head"><div><span>TIENDA ATA</span><h2>'+title+'</h2></div><a href="#/catalogo">Ver catálogo →</a></div><div class="related-grid">'+scored.map(card).join('')+'</div>';
    host.insertAdjacentElement('afterend',section);
  }
  const observer=new MutationObserver(()=>{if(location.hash.startsWith('#/producto/')) setTimeout(mount,40)});
  observer.observe(document.getElementById('app'),{childList:true,subtree:true});
  window.addEventListener('hashchange',()=>setTimeout(mount,80));
  setTimeout(mount,500);
})();
</script><script defer>
(function(){
  const key='tiendaAtaTheme';
  const saved=localStorage.getItem(key);
  if(saved==='light') document.body.classList.add('light-mode');
  function addToggle(){
    const nav=document.querySelector('.hd nav');
    if(!nav||nav.querySelector('.theme-toggle')) return;
    const b=document.createElement('button');
    b.className='theme-toggle';
    b.type='button';
    b.setAttribute('aria-label','Cambiar modo de color');
    b.title='Cambiar modo claro/oscuro';
    const sync=()=>{const light=document.body.classList.contains('light-mode');b.textContent=light?'☾':'☀';b.title=light?'Cambiar a modo oscuro':'Cambiar a modo claro';};
    b.onclick=()=>{document.body.classList.toggle('light-mode');localStorage.setItem(key,document.body.classList.contains('light-mode')?'light':'dark');sync();};
    nav.appendChild(b);sync();
  }
  new MutationObserver(addToggle).observe(document.getElementById('app'),{childList:true,subtree:true});
  setTimeout(addToggle,80);
})();
</script></body></html>
