<style>

html{background:linear-gradient(180deg,#faf9f7 0%,#f2f0ec 45%,#f6f4f1 100%);min-height:100%}
body{margin:0;font:15px/1.4 system-ui,sans-serif;color:var(--fg);background:transparent}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:24px 0 10px}h3{font-size:15px;margin:0 0 8px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:4px}

.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 60px}
.hd{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;margin:0 -16px 14px;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border-bottom:1px solid var(--glass-brd);box-shadow:0 1px 0 var(--glass-hi) inset,0 10px 24px -18px rgba(29,29,27,.3)}

.hd nav a{padding:4px 2px;transition:color .15s}.hd nav a:hover{color:var(--mu)}
.btn{background:var(--fg);color:#fff;border:1px solid var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .12s,box-shadow .12s,background .15s}
.btn:hover{box-shadow:0 4px 14px -6px rgba(29,29,27,.45)}.btn:active{transform:scale(.97)}
.btn.s{background:var(--glass-strong);color:var(--fg);border-color:var(--glass-brd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.btn.s{background:#fff}}
.btn.s:hover{background:#fff}.btn.d{background:#fff;color:var(--rd);border-color:var(--rd)}.btn.d:hover{background:#fff5f4}

input,select,textarea{border:1px solid #bbb;border-radius:8px;padding:8px;background:#fff;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#999}
input:focus,select:focus,textarea:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(29,29,27,.08)}
label{display:block;margin:8px 0;font-size:13px;color:var(--mu)}label input,label select,label textarea{display:block;width:100%;margin-top:3px;color:var(--fg)}label.ck{display:flex;gap:8px;align-items:center;color:var(--fg)}label.ck input{width:auto;margin:0}
.srch{display:flex;gap:8px}.srch input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{border:1px solid var(--glass-brd);background:var(--glass-strong);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;padding:5px 14px;text-decoration:none;transition:background .15s,transform .12s}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.chips a{background:#fff}}
.chips a:hover{background:#fff}.chips a:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{text-decoration:none;display:block;position:relative;border-radius:8px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(29,29,27,.35)}
.card img,.card .ph{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--sf);border-radius:10px;display:block}
.card b{display:block;margin-top:6px;font-weight:600}
.card em{position:absolute;top:8px;left:8px;background:var(--glass-strong);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-brd);border-radius:4px;padding:1px 7px;font-size:12px;font-style:normal}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card em{background:#fff}}
.old{color:var(--mu);text-decoration:line-through;margin-left:6px;font-size:13px}
.ph{display:flex;align-items:center;justify-content:center;background:var(--sf);color:var(--mu);font-size:13px;text-align:center;min-height:80px;border-radius:10px}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end;margin:16px 0;padding:14px;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-brd);border-radius:14px;box-shadow:0 1px 0 var(--glass-hi) inset}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.flt{background:#fbfaf8}}
.flt label{margin:0}
.pd{display:grid;gap:20px}@media(min-width:800px){.pd{grid-template-columns:1.1fr 1fr}}
.gal{position:relative}.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:12px;background:var(--sf)}.track::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/4}.sl img,.sl .ph{width:100%;height:100%;object-fit:contain;display:block}
.gb{position:absolute;bottom:10px;background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:10px;padding:6px 10px;cursor:pointer;box-shadow:0 4px 14px -8px rgba(29,29,27,.4);transition:background .15s}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.gb{background:#fff}}
.gb:hover{background:#fff}.gb.l{left:10px}.gb.r{right:10px}
.cnt{position:absolute;top:10px;right:10px;background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:12px;padding:1px 9px;font-size:12px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.cnt{background:#fff}}
.th{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.th button{border:1px solid var(--ln);background:var(--sf);padding:0;width:56px;height:70px;border-radius:8px;cursor:pointer;flex:none;transition:border-color .15s}
.th button:hover{border-color:var(--fg)}.th img{width:100%;height:100%;object-fit:contain}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sz{min-width:46px;padding:8px 12px;border:1px solid #bbb;background:#fff;border-radius:8px;cursor:pointer;transition:transform .1s,border-color .15s}
.sz:hover:not(:disabled){border-color:var(--fg)}.sz:active:not(:disabled){transform:scale(.96)}
.sz.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.sz:disabled{color:#aaa;background:var(--sf);text-decoration:line-through;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.mu{color:var(--mu)}
.note{background:#fff8e1;border:1px solid #ecd58a;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}td input[type=number]{width:80px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.ci img{width:56px;height:70px;object-fit:contain;background:var(--sf);border-radius:8px}.ci>div{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:6px;background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--glass-brd);border-radius:14px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabs{background:#fbfaf8}}
.tabs a{padding:7px 14px;border-radius:9px;text-decoration:none;border:1px solid transparent;transition:background .15s}
.tabs a:hover{background:rgba(29,29,27,.06)}.tabs a.on{background:var(--fg);color:#fff}
.tag{font-size:12px;border:1px solid #bbb;border-radius:4px;padding:1px 7px;margin-right:4px}.tag.r{color:var(--rd);border-color:var(--rd)}
.thm{width:48px;height:60px;object-fit:contain;background:var(--sf);border-radius:6px}
section.f{border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0;background:#fff}
.dz{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px dashed #bbb;border-radius:12px;padding:12px;transition:background .15s,border-color .15s}
.dz.o{background:var(--glass);border-color:var(--fg)}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.tn{position:relative;border:1px solid var(--ln);border-radius:8px;padding:4px}
.tn img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--sf);border-radius:4px}
.nm{position:absolute;top:6px;left:6px;background:var(--fg);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;z-index:1}
.tn i{position:absolute;top:6px;right:6px;background:var(--glass-strong);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-brd);border-radius:4px;font-size:11px;padding:0 5px;font-style:normal}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tn i{background:#fff}}
.tn .ac{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.tn .ac button{font-size:12px;padding:2px 6px;border:1px solid #bbb;background:#fff;border-radius:6px;cursor:pointer}
.bar{position:sticky;bottom:0;background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border-top:1px solid var(--glass-brd);box-shadow:0 -10px 24px -18px rgba(29,29,27,.3);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;margin:0 -16px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bar{background:#fbfaf8}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--glass-dark);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);color:#fff;padding:9px 16px;border-radius:12px;z-index:99;max-width:90%;border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.toast{background:var(--fg)}}
.modal{position:fixed;inset:0;background:rgba(20,20,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 10px 10px;overflow:auto}
.phone{width:375px;max-width:100%;background:#fff;border-radius:22px;padding:16px;border:8px solid #222;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.pf{border-top:1px solid var(--ln);margin-top:30px;padding:16px 0;text-align:center}.pf a{color:var(--mu);font-size:12px;text-decoration:none}.pf a:hover{text-decoration:underline}
.ahd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}.ahd a{color:var(--mu);font-size:13px;text-decoration:none}.ahd a:hover{text-decoration:underline}
span.bad{background:rgba(29,29,27,.08);border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.low{border-color:var(--rd)!important}
	@media(max-width:700px){table{display:block;overflow-x:auto}}

/* Tienda Ata — first visual pass: warm boutique surfaces, with glass reserved for controls. */
:root{
  --fg:#252720;--mu:#6d7067;--ln:rgba(43,48,38,.14);--sf:#efeee8;--rd:#a34338;
  --olive:#66735a;--glass:rgba(249,248,243,.78);--glass-strong:rgba(255,255,252,.86);
  --glass-brd:rgba(57,66,47,.14);--glass-hi:rgba(255,255,255,.72);--glass-dark:rgba(35,38,31,.88);
  --blur:14px;--ease:cubic-bezier(.2,.7,.2,1)
}
html{background:radial-gradient(ellipse at 50% -24%,#fff 0,#f8f7f2 40%,#f1f0e9 100%);background-attachment:fixed}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
.wrap{max-width:1160px;padding:12px 20px 64px}
.hd{margin:0 -20px 24px;padding:12px 20px;background:var(--glass);border:1px solid var(--glass-brd);border-top:0;border-radius:0 0 18px 18px;box-shadow:0 1px 0 var(--glass-hi) inset,0 12px 28px -24px rgba(35,38,31,.42);backdrop-filter:blur(var(--blur)) saturate(145%);-webkit-backdrop-filter:blur(var(--blur)) saturate(145%)}
.brand{display:flex;align-items:center;min-height:44px;color:var(--fg);font-size:18px;font-weight:700;letter-spacing:-.045em;white-space:nowrap}
.hd nav{gap:5px}
.hd nav a{display:inline-flex;align-items:center;min-height:44px;padding:7px 13px;border:1px solid transparent;border-radius:999px;text-decoration:none;transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
.hd nav a:hover{background:rgba(255,255,255,.62);border-color:var(--glass-brd);color:var(--fg)}
.hd nav a:active{transform:scale(.97)}
h1{font-size:clamp(25px,3vw,32px);line-height:1.15;letter-spacing:-.04em;margin:10px 0 18px}
h2{font-size:20px;line-height:1.25;letter-spacing:-.025em;margin:30px 0 13px}
h3{letter-spacing:-.015em}
.srch{max-width:740px;align-items:center;padding:6px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;box-shadow:0 1px 0 var(--glass-hi) inset,0 10px 24px -22px rgba(35,38,31,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.srch input{min-height:44px;border:1px solid transparent;background:transparent;padding:9px 12px}
.srch input:focus{border-color:var(--glass-brd);box-shadow:0 0 0 3px rgba(102,115,90,.13)}
.btn{min-height:44px;border-radius:12px;background:var(--fg);border-color:var(--fg);font-weight:600;transition:transform .14s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease)}
.btn:hover{box-shadow:0 7px 18px -11px rgba(35,38,31,.75);background:#34382f}
.btn:active{transform:scale(.975)}
.btn.s{background:var(--glass-strong);border-color:var(--glass-brd);box-shadow:0 1px 0 var(--glass-hi) inset;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.s:hover{background:#fff}
.btn.d{color:var(--rd);border-color:rgba(163,67,56,.42);background:rgba(255,255,255,.82)}
.btn.sm{min-height:36px;border-radius:10px}
input,select,textarea{border-color:rgba(43,48,38,.22);border-radius:11px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(102,115,90,.14)}
.chips{gap:9px}
.chips a{display:inline-flex;align-items:center;min-height:40px;padding:7px 15px;border-color:var(--glass-brd);border-radius:999px;background:var(--glass-strong);box-shadow:0 1px 0 var(--glass-hi) inset;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:transform .14s var(--ease),background .16s var(--ease),border-color .16s var(--ease)}
.chips a:hover{background:#fff;border-color:rgba(102,115,90,.28)}
.chips a:active{transform:scale(.97)}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,205px),1fr));gap:22px 18px}
.card{border-radius:16px;color:var(--fg);transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:0 13px 26px -24px rgba(35,38,31,.5)}
.card img,.card .ph{aspect-ratio:4/5;border-radius:16px;background:#eeede7}
.card b{margin-top:10px;font-size:15px;line-height:1.35}
.card>span{display:inline-block;margin-top:3px;font-variant-numeric:tabular-nums}
.card em{top:10px;left:10px;padding:4px 9px;border-color:var(--glass-brd);border-radius:999px;background:var(--glass-strong);font-weight:600}
.old{color:#77796f;font-size:12px}
.ph{border:1px solid rgba(43,48,38,.06);color:#6b6c65}
.flt{padding:16px;background:var(--glass);border-color:var(--glass-brd);border-radius:18px;box-shadow:0 1px 0 var(--glass-hi) inset,0 12px 24px -24px rgba(35,38,31,.48);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.flt label{font-size:12px;font-weight:600;color:#66695f}
.pd{gap:clamp(20px,4vw,48px)}
.track{border:1px solid rgba(43,48,38,.08);border-radius:18px;background:#eeede7}
.sl{aspect-ratio:4/5}
.gb,.cnt{border:1px solid var(--glass-brd);background:var(--glass-strong);box-shadow:0 2px 9px -5px rgba(35,38,31,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gb{min-height:42px;border-radius:12px}
.cnt{padding:4px 10px;border-radius:999px;font-weight:600}
.th button,.sz{border-radius:11px;transition:transform .14s var(--ease),border-color .15s var(--ease),background .15s var(--ease)}
.sz{min-height:44px;border-color:rgba(43,48,38,.22)}
.sz.on{background:var(--olive);border-color:var(--olive)}
.sz:disabled{opacity:.65}
.acts{gap:10px}
.ci{gap:14px;padding:14px 0;border-color:var(--ln)}
.ci img{border-radius:11px;background:var(--sf)}
.tabs{gap:7px;padding:7px;background:var(--glass);border-color:var(--glass-brd);border-radius:16px;backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
.tabs a{min-height:42px;display:inline-flex;align-items:center;padding:7px 15px;border-radius:11px}
.tabs a.on{background:var(--fg)}
section.f{border-color:var(--glass-brd);border-radius:16px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
.dz{border-color:rgba(43,48,38,.22);border-radius:14px}
.tn{border-color:var(--ln);border-radius:12px;background:#fff}
.bar{background:var(--glass);border-color:var(--glass-brd);backdrop-filter:blur(var(--blur)) saturate(145%);-webkit-backdrop-filter:blur(var(--blur)) saturate(145%)}
.toast{background:var(--glass-dark);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modal{background:rgba(34,36,30,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.phone{border:1px solid var(--glass-brd);border-radius:24px;box-shadow:0 26px 70px -36px rgba(0,0,0,.55)}
.pf{border-color:var(--ln)}
.note{border-radius:12px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hd,.srch,.flt,.tabs,.bar{background:#f8f7f2}
  .chips a,.btn.s,.gb,.cnt,.card em{background:#fff}
}
@media(prefers-reduced-transparency:reduce){
  .hd,.srch,.flt,.tabs,.bar{background:#f8f7f2}
  .chips a,.btn.s,.gb,.cnt,.card em{background:#fff}
}
@media(max-width:700px){
  .wrap{padding:8px 14px 48px}
  .hd{margin:0 -14px 20px;padding:8px 14px;border-radius:0 0 15px 15px}
  .hd nav{gap:2px}
  .hd nav a{padding:6px 9px;font-size:13px}
  .brand{font-size:17px}
  h2{margin-top:25px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .card img,.card .ph{border-radius:13px}
  .flt{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
  .srch{gap:4px}
  .srch .btn{padding:9px 12px}
  .bar{padding:10px 14px;margin:0 -14px}
  .ci{gap:10px}
  .btn.sm{min-height:40px}
}
@media(max-width:380px){
  .hd nav a{padding:6px 7px;font-size:12px}
  .brand{font-size:16px}
  .grid{gap:16px 10px}
}


/* Tienda Ata — corrección de visibilidad: tema claro permanente */
:root{--fg:#252720;--mu:#6d7067;--ln:rgba(43,48,38,.14);--sf:#efeee8;--rd:#a34338;--olive:#66735a;--glass:rgba(249,248,243,.88);--glass-strong:rgba(255,255,252,.96);--glass-brd:rgba(57,66,47,.14);--glass-hi:rgba(255,255,255,.72);--glass-dark:rgba(35,38,31,.88);--blur:14px}
html{background:radial-gradient(ellipse at 50% -24%,#fff 0,#f8f7f2 40%,#f1f0e9 100%);color:var(--fg)}
body{background:transparent!important;color:var(--fg)!important}

/* ─────────────────────────────────────────────────────────────
   TIENDA ATA — Liquid Glass visual system
   Uses the Liquid Glass JS-inspired displacement engine loaded
   from /liquid-glass-engine.js.
   ───────────────────────────────────────────────────────────── */
:root{
  --lg-blue:rgba(105,165,255,.34);
  --lg-violet:rgba(170,128,255,.24);
  --lg-pink:rgba(255,130,184,.22);
  --lg-cyan:rgba(89,224,226,.18);
  --lg-green:rgba(154,214,130,.18);
  --lg-surface:rgba(255,255,255,.48);
  --lg-surface-strong:rgba(255,255,255,.62);
  --lg-border:rgba(255,255,255,.62);
  --lg-shadow:0 22px 60px rgba(42,56,79,.12),0 2px 8px rgba(42,56,79,.06),inset 0 1px 0 rgba(255,255,255,.72);
  --lg-glow:0 0 0 1px rgba(255,255,255,.26) inset;
}
html{
  background:
    radial-gradient(circle at 8% 4%,rgba(255,255,255,.95),transparent 22%),
    radial-gradient(circle at 90% 2%,rgba(200,221,255,.56),transparent 28%),
    linear-gradient(120deg,#eef4fb 0%,#f8f7fb 44%,#f7f0f5 100%) !important;
  background-attachment:fixed;
}
body{
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 20%,var(--lg-blue),transparent 25%),
    radial-gradient(circle at 86% 16%,var(--lg-pink),transparent 24%),
    radial-gradient(circle at 63% 76%,var(--lg-violet),transparent 27%),
    radial-gradient(circle at 18% 86%,var(--lg-green),transparent 23%),
    linear-gradient(135deg,#edf3fa 0%,#f8f7fb 48%,#f5eef4 100%) !important;
  background-size:140% 140%;
  animation:ataAurora 18s ease-in-out infinite alternate;
}
body::before{
  content:"";
  position:fixed;
  inset:-22%;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 22%,rgba(115,173,255,.28),transparent 18%),
    radial-gradient(circle at 82% 18%,rgba(255,126,182,.22),transparent 17%),
    radial-gradient(circle at 68% 78%,rgba(166,125,255,.20),transparent 20%);
  filter:blur(28px) saturate(118%);
  opacity:.82;
  animation:ataOrbs 24s ease-in-out infinite alternate;
}
.wrap{position:relative;z-index:1}
@keyframes ataAurora{
  0%{background-position:0% 0%}
  50%{background-position:75% 35%}
  100%{background-position:100% 100%}
}
@keyframes ataOrbs{
  0%{transform:translate3d(-2%,0,0) scale(1)}
  50%{transform:translate3d(3%,-2%,0) scale(1.04)}
  100%{transform:translate3d(-1%,3%,0) scale(1.08)}
}

/* Real Liquid Glass surfaces */
.liquid-glass-surface{
  --lg-opacity:.9;
  --lg-scale:1;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:
    linear-gradient(135deg,rgba(255,255,255,.60),rgba(255,255,255,.24) 48%,rgba(255,255,255,.42)) !important;
  border:1px solid var(--lg-border) !important;
  box-shadow:var(--lg-shadow),var(--lg-glow) !important;
  backdrop-filter:
    blur(var(--lg-blur,18px))
    saturate(1.25)
    contrast(1.06)
    brightness(1.04)
    var(--lg-filter,none) !important;
  -webkit-backdrop-filter:
    blur(var(--lg-blur,18px))
    saturate(1.25)
    contrast(1.06)
    brightness(1.04) !important;
  transform:translateZ(0) scale(var(--lg-scale));
  transition:
    transform .35s cubic-bezier(.2,.7,.2,1),
    box-shadow .35s cubic-bezier(.2,.7,.2,1),
    border-color .35s ease,
    background .35s ease;
}
.liquid-glass-surface::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,255,255,.72),transparent 28%),
    radial-gradient(circle at 100% 100%,rgba(255,255,255,.30),transparent 32%),
    linear-gradient(110deg,rgba(255,255,255,.14),transparent 32%,rgba(255,255,255,.08) 68%,transparent);
  opacity:calc(.55 * var(--lg-opacity));
  mix-blend-mode:screen;
}
.liquid-glass-surface > *{position:relative;z-index:1}
.liquid-glass-surface:hover{
  --lg-opacity:1;
  --lg-scale:1.012;
  border-color:rgba(255,255,255,.78) !important;
  box-shadow:
    0 30px 72px rgba(42,56,79,.15),
    0 8px 24px rgba(42,56,79,.09),
    inset 0 1px 0 rgba(255,255,255,.86) !important;
}
.liquid-glass-surface:active{--lg-scale:.995}
.liquid-glass-surface:focus-visible{
  outline:2px solid rgba(95,143,255,.62);
  outline-offset:3px;
}

}

@keyframes ataBannerFloat{
  0%{transform:translate3d(-8px,4px,0) scale(.98);opacity:.72}
  100%{transform:translate3d(12px,-8px,0) scale(1.05);opacity:.95}
}

.sales-note{margin:10px 0;padding:11px 13px;border:1px solid var(--glass-brd);border-radius:12px;background:rgba(255,255,255,.58)}
.sales-success,.tracking-card{max-width:860px;margin:18px auto;padding:24px;border:1px solid var(--glass-brd);border-radius:22px;background:var(--glass);box-shadow:0 18px 46px -34px rgba(35,38,31,.55)}
.sales-kicker{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;background:rgba(102,115,90,.12);color:var(--olive);font-size:11px;font-weight:800;letter-spacing:.08em}
.sales-success p{max-width:650px;color:var(--mu)}
.tracking-shell{max-width:900px;margin:0 auto;padding-bottom:30px}
.tracking-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.tracking-status{display:inline-flex;align-items:center;min-height:34px;padding:7px 12px;border:1px solid var(--glass-brd);border-radius:999px;background:var(--glass-strong);font-weight:700;white-space:nowrap}
.tracking-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 22px}
.tracking-step{position:relative;min-height:84px;padding:11px 8px;border:1px solid var(--glass-brd);border-radius:15px;background:rgba(255,255,255,.5);text-align:center}
.tracking-step span{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 7px;border-radius:50%;border:1px solid var(--glass-brd);background:#fff;font-size:12px;font-weight:800}
.tracking-step.done{background:rgba(102,115,90,.08);border-color:rgba(102,115,90,.2)}
.tracking-step.done span{background:var(--olive);color:#fff;border-color:var(--olive)}
.tracking-step.active{box-shadow:0 0 0 2px rgba(102,115,90,.1) inset}
.tracking-step b{display:block;font-size:12px;line-height:1.25}
.tracking-step small{display:block;margin-top:4px;color:var(--olive);font-size:11px}
.tracking-cancelled{padding:14px;border-radius:14px;border:1px solid rgba(163,67,56,.25);background:rgba(163,67,56,.07);color:var(--rd);font-weight:700}
.tracking-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.tracking-summary>div{padding:13px;border:1px solid var(--glass-brd);border-radius:14px;background:rgba(255,255,255,.55)}
.tracking-summary span{display:block;color:var(--mu);font-size:11px;margin-bottom:4px}
.tracking-summary b{font-size:14px}
.tracking-items{padding-top:5px}
.tracking-item{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--ln)}
.tracking-item span:last-child{color:var(--mu);text-align:right}
.sales-message{margin:18px 0;padding:14px 15px;border-radius:15px;background:rgba(102,115,90,.08);border:1px solid rgba(102,115,90,.14)}
.tracking-updated{margin-top:14px;font-size:12px}
.tracking-history{margin-top:10px;border-top:1px solid var(--ln)}
.tracking-history>div,.admin-history>div{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid var(--ln)}
.tracking-history span,.admin-history span{color:var(--mu);font-size:12px}
.sales-settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sales-settings-grid label{margin:0}.sales-settings-grid textarea{min-height:112px;resize:vertical}
.order-detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:8px 0 14px}
.order-controls-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.order-customer{margin-top:16px}
@media(max-width:760px){.tracking-steps{grid-template-columns:1fr 1fr}.tracking-summary{grid-template-columns:1fr 1fr}.sales-settings-grid,.order-controls-grid{grid-template-columns:1fr}.tracking-item,.order-detail-head{align-items:flex-start;flex-direction:column}.tracking-item span:last-child{text-align:left}.tracking-status{white-space:normal}}
@media(max-width:520px){.sales-success,.tracking-card{padding:18px;border-radius:18px}.tracking-steps{grid-template-columns:1fr}.tracking-summary{grid-template-columns:1fr}.sales-success .acts,.tracking-card .acts{flex-direction:column;align-items:stretch}.sales-success .acts .btn,.tracking-card .acts .btn{width:100%;text-align:center}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  if (!window.supabase) {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\\/script>');
  }
</script></head><body>
<div class="wrap" id="app"></div>

<script src="/app.js" defer></script><script defer>
/* Tienda Ata — productos relacionados en detalle */
(function(){
  const SUPABASE_URL='https://svvylvtmmynxkmdowymx.supabase.co';
  const SUPABASE_KEY='sb_publishable_RYbyrmTxY4Qv2rKTuxeT6Q_70Juauak';
  let cache=null, loading=false;
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);
  const money=(v)=>'$'+Number(v||0).toLocaleString('es-MX')+' MXN';
  const img=(src,name)=>{
    const url=String(src||'');
    return /^https:\/\//i.test(url)
      ? '<img src="'+esc(url)+'" alt="'+esc(name)+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'ph\',textContent:\'Sin foto\'}))">'
      : '<div class="ph">Sin foto</div>';
  };
  async function products(){
    if(cache) return cache;
    if(loading) return [];
    loading=true;
    try{
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
      const {data,error}=await client.from('products').select('id,data,is_demo,created_at').order('created_at',{ascending:false});
      if(error) throw error;
      cache=(data||[]).filter(r=>r.data&&typeof r.data==='object'&&r.data.status==='published').map(r=>({...r.data,id:r.id}));
      return cache;
    }catch(e){console.warn('No se pudieron cargar productos relacionados:',e);return []}
    finally{loading=false}
  }
  function card(p){
    return '<a class="related-card" href="#/producto/'+encodeURIComponent(p.id)+'">'+img((p.photos||[])[0],p.name||'Producto')+
      '<div class="related-info"><b>'+esc(p.name||'Producto')+'</b><span>'+money(p.price)+'</span></div></a>';
  }
  async function mount(){
    if(!location.hash.startsWith('#/producto/')) return;
    const host=document.querySelector('.pd');
    if(!host||host.querySelector('.related-products')) return;
    const id=decodeURIComponent(location.hash.slice('#/producto/'.length).split('?')[0]);
    const list=await products();
    const current=list.find(p=>p.id===id);
    if(!current) return;
    const others=list.filter(p=>p.id!==id);
    const scored=others.map(p=>{
      let score=0;
      if(current.cat&&p.cat===current.cat) score+=5;
      if(current.brand&&p.brand&&p.brand===current.brand) score+=4;
      if(current.sizes&&p.sizes) score+=1;
      if(Number(p.stock||0)>0 || Object.values(p.sizes||{}).some(n=>Number(n)>0)) score+=1;
      return {p,score};
    }).sort((a,b)=>b.score-a.score||String(a.p.name).localeCompare(String(b.p.name))).slice(0,8).map(x=>x.p);
    if(!scored.length) return;
    const section=document.createElement('section');
    section.className='related-products';
    const title=current.cat ? 'También te puede gustar' : 'Más productos';
    section.innerHTML='<div class="related-head"><div><h2>'+title+'</h2></div><a href="#/catalogo">Ver catálogo →</a></div><div class="related-grid">'+scored.map(card).join('')+'</div>';
    host.insertAdjacentElement('afterend',section);
  }
  const observer=new MutationObserver(()=>{if(location.hash.startsWith('#/producto/')) setTimeout(mount,40)});
  observer.observe(document.getElementById('app'),{childList:true,subtree:true});
  window.addEventListener('hashchange',()=>setTimeout(mount,80));
  setTimeout(mount,500);
})();
</script></body></html>
