span.bad{background:rgba(29,29,27,.08);border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}

@media(max-width:700px){table{display:block;overflow-x:auto}}

<script>

if(it){if(it.qty>=st){toast('No hay más existencias');return false}it.qty++}else S.c.push({pid:p.id,size:sel||'',qty:1});save();$('#cc').textContent=cnt();toast('Agregado al carrito');return true};

const NOTE='<div class="note">Pedido de prueba: no se envía a ninguna tienda y no se realiza ningún cobro.</div>';

async function placeOrder(f){const r=cartRows();if(!r.length)return;const cb=$('#cb');if(cb){if(cb.disabled)return;cb.disabled=true;cb.textContent='Enviando…'}

r.forEach(({i,p})=>{if(p.sizes)p.sizes[i.size]=Math.max(0,p.sizes[i.size]-i.qty);else p.stock=Math.max(0,p.stock-i.qty)});S.o.unshift(o);S.c=[];save();go('#/confirmacion/'+o.n)}

function orders(){return S.o.length?`<table><tr><th>N.º<th>Cliente<th>Total<th>Estado<th></tr>${S.o.map(o=>`<tr><td>#${o.n}<td>${esc(o.name)}<td>${money(ot(o))}<td>${esc(o.status)}<td><a class="btn s sm" href="#/admin/pedido/${o.n}">Abrir</a></tr>`).join('')}</table>`:'<p class="mu">Aún no hay pedidos. Haz uno de prueba en la tienda.</p>'}
function order(n){const o=S.o.find(x=>x.n==n);if(!o)return '<p>Pedido no encontrado.</p>';

<table><tr><th>Producto<th>Talla<th>Cant.<th>Precio</tr>${o.items.map(i=>`<tr><td>${esc(i.name)}<td>${esc(i.size||'—')}<td>${i.qty}<td>${money(i.price)}</tr>`).join('')}</table><h3 style="margin-top:12px">Total: ${money(ot(o))}</h3>
<p><b>Nombre:</b> ${esc(o.name)}<br><b>Teléfono:</b> ${esc(o.phone)}<br><b>Dirección:</b> ${esc(o.addr)}<br><b>Notas:</b> ${esc(o.notes||'—')}</p>`}
function setSt(n,v){const o=S.o.find(x=>x.n==n);o.status=v;const{n:_,...d}=o;sb('orders?n=eq.'+n,{m:'PATCH',b:{data:d}}).then(()=>toast('Estado actualizado')).catch(()=>toast('No se pudo actualizar'))}
function plist(q=''){q=q.toLowerCase();const l=S.p.filter(p=>!q||(p.name+p.brand+p.cat).toLowerCase().includes(q));
return l.length?`<table><tr><th><th>Producto<th>Precio<th>Tallas y stock<th>Estado<th></tr>${l.map(p=>`<tr><td>${im(p.photos[0],p.name,'thm')}<td>${esc(p.name)}${p.isDemo?' <span class="mu">(ejemplo)</span>':''}<td>${money(p.price)}<td>${p.sizes?Object.entries(p.sizes).map(([k,v])=>esc(k)+': '+v).join(', '):'Stock: '+p.stock}<td><span class="tag">${ST[p.status]}</span>${tot(p)?'':'<span class="tag r">Agotado</span>'}
<td><div class="row"><a class="btn s sm" href="#/admin/producto/${p.id}">Editar</a><button class="btn s sm" onclick="dup('${p.id}')">Duplicar</button><button class="btn s sm" onclick="tgl('${p.id}')">${p.status==='published'?'Ocultar':'Publicar'}</button><button class="btn d sm" onclick="del('${p.id}')">Eliminar</button></div></tr>`).join('')}</table>`:'<p class="mu">No hay productos.</p>'}
function products(){return `<div class="row"><input id="pq" placeholder="Buscar producto" oninput="$('#pl').innerHTML=plist(this.value)" style="flex:1"><a class="btn" href="#/admin/producto/nuevo">Nuevo producto</a><button class="btn d" onclick="delDemo()">Eliminar productos de ejemplo</button></div><div id="pl" style="margin-top:10px">${plist()}</div>`}
const rl=()=>{const q=$('#pq');$('#pl').innerHTML=plist(q?q.value:'')};
function dup(id){const p=S.p.find(x=>x.id===id),c=JSON.parse(JSON.stringify(p));c.id='p'+Date.now();c.name+=' (copia)';c.status='draft';c.isDemo=false;S.p.push(c);save();rl();toast('Borrador creado')}
function tgl(id){const p=S.p.find(x=>x.id===id);p.status=p.status==='published'?'hidden':'published';save();rl()}
function del(id){if(confirm('¿Eliminar este producto?')){S.p=S.p.filter(x=>x.id!==id);save();rl()}}
function delDemo(){const n=S.p.filter(p=>p.isDemo).length;if(!n)return toast('No hay productos de ejemplo');if(confirm(`Se eliminarán ${n} productos de ejemplo. Los que creaste tú se conservan. ¿Continuar?`)){S.p=S.p.filter(p=>!p.isDemo);save();rl()}}
function resetDemo(){if(confirm('Se restaurarán los productos de ejemplo originales. Tus productos y pedidos se conservan. ¿Continuar?')){S.p=[...seed(),...S.p.filter(p=>!p.isDemo)];save();toast('Datos de ejemplo restablecidos')}}
function inv(){return `<table><tr><th>Producto<th>Talla<th>Cantidad</tr>${S.p.flatMap(p=>(p.sizes?Object.keys(p.sizes):['']).map(s=>`<tr><td>${esc(p.name)}<td>${esc(s||'—')}<td><input type="number" min="0" class="${stk(p,s)<=2?'low':''}" value="${stk(p,s)}" aria-label="Cantidad de ${esc(p.name)} ${esc(s)}" onchange="setStk('${p.id}','${esc(s)}',this.value)"></tr>`)).join('')}</table>`}
function setStk(id,s,v){const p=S.p.find(x=>x.id===id);v=Math.max(0,Math.floor(+v||0));if(p.sizes)p.sizes[s]=v;else p.stock=v;save();toast('Cantidad guardada')}
const sets=()=>`<div class="acts"><button class="btn s" onclick="resetDemo()">Restablecer datos de ejemplo</button><button class="btn d" onclick="delDemo()">Eliminar productos de ejemplo</button></div><p class="mu">Los datos se guardan en Supabase.</p>`;
const blank=()=>({id:'p'+Date.now(),name:'',brand:'',cat:'',price:'',old:'',desc:'',photos:[],sizes:{S:0,M:0,L:0},stock:0,status:'draft',isDemo:false,det:{}});
function editor(id){ed=id==='nuevo'?blank():JSON.parse(JSON.stringify(S.p.find(p=>p.id===id)||blank()));dirty=false;
return `<h2>${id==='nuevo'?'Nuevo producto':'Editar producto'}</h2>
<section class="f"><h3>Fotos</h3><div id="ph"></div></section>
<section class="f"><h3>Nombre, marca y categoría</h3><label>Nombre<input data-f="name"></label><label>Marca (opcional)<input data-f="brand"></label><label>Categoría<input data-f="cat" list="cl"></label><datalist id="cl">${[...new Set(S.p.map(p=>p.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></section>
<section class="f"><h3>Precio y precio anterior</h3><div class="row"><label>Precio (MXN)<input data-f="price" type="number" min="0"></label><label>Precio anterior (opcional)<input data-f="old" type="number" min="0"></label></div></section>
<section class="f"><h3>Tallas y stock</h3><div id="sz"></div></section>
<section class="f"><h3>Descripción</h3><textarea data-f="desc" rows="3" style="width:100%"></textarea></section>
<details class="f"><summary>Detalles opcionales</summary><label>Color<input data-d="color"></label><label>Material<input data-d="material"></label><label>Corte o ajuste<input data-d="fit"></label><label>Condición<input data-d="cond"></label></details>
<div class="bar"><button class="btn s" id="bd" onclick="saveP('draft')">Guardar borrador</button><button class="btn s" onclick="openPv()">Vista previa</button><button class="btn" id="bp" onclick="saveP('published')">Publicar</button></div>`}
function bindEd(){$$('[data-f]').forEach(el=>{const f=el.dataset.f;el.value=ed[f]??'';el.oninput=()=>{ed[f]=el.type==='number'?(el.value===''?'':+el.value):el.value;dirty=true}});
$$('[data-d]').forEach(el=>{const f=el.dataset.d;el.value=ed.det[f]||'';el.oninput=()=>{ed.det[f]=el.value;dirty=true}});phr();szr()}
const rd=f=>new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas'),x=c.getContext('2d');c.width=i.width*k;c.height=i.height*k;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);
c.toBlob(async b=>{try{const n=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg',x=await fetch(SB+'/storage/v1/object/fotos/'+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'image/jpeg'},body:b});if(!x.ok)throw 0;r(SB+'/storage/v1/object/public/fotos/'+n)}catch(e){r(null)}},'image/jpeg',.75)};i.onerror=()=>r(null);i.src=u});
async function addF(fs,at){fs=[...fs].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;const af=$('#af');if(af){af.disabled=true;af.textContent='Subiendo…'}
if(at!=null){const d=fs[0]&&await rd(fs[0]);if(d){ed.photos[at]=d;dirty=true}return phr()}
let over=false;for(const f of fs){if(ed.photos.length>=6){over=true;break}const d=await rd(f);d?ed.photos.push(d):toast('No se pudo subir una imagen')}if(over)toast('Puedes agregar hasta 6 fotos');dirty=true;phr()}
function phr(){const a=ed.photos;$('#ph').innerHTML=`<div class="dz" id="dz"><button class="btn s" id="af">Agregar fotos</button><span class="mu">o arrástralas aquí</span><b>${a.length} de 6</b><input id="fi" type="file" accept="image/*" multiple hidden></div>
<div class="tl">${a.map((s,i)=>`<div class="tn"><span class="nm">${i+1}</span>${i?'':'<i>Portada</i>'}${im(s,ed.name||'Producto')}<div class="ac"><button data-a="l" data-i="${i}" ${i?'':'disabled'} title="Mover antes">‹</button><button data-a="r" data-i="${i}" ${i<a.length-1?'':'disabled'} title="Mover después">›</button>${i?`<button data-a="c" data-i="${i}">Portada</button>`:''}<button data-a="s" data-i="${i}">Cambiar</button><button data-a="q" data-i="${i}">Quitar</button></div></div>`).join('')}</div>`;
const fi=$('#fi'),dz=$('#dz');$('#af').onclick=()=>fi.click();fi.onchange=()=>{addF(fi.files);fi.value=''};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('o')};dz.ondragleave=()=>dz.classList.remove('o');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('o');addF(e.dataTransfer.files)};
$$('.ac button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=b.dataset.a;dirty=true;
if(k==='l'||k==='r'){const j=k==='l'?i-1:i+1;[a[i],a[j]]=[a[j],a[i]]}else if(k==='c')a.unshift(a.splice(i,1)[0]);else if(k==='q')a.splice(i,1);
else{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>addF(f.files,i);f.click();return}phr()})}
function szr(){const has=!!ed.sizes;$('#sz').innerHTML=`<label class="ck"><input type="checkbox" id="hs" ${has?'checked':''}>Este artículo tiene tallas</label>`+(has?`<table><tr><th>Talla<th>Stock<th></tr>${Object.entries(ed.sizes).map(([k,v])=>`<tr><td>${esc(k)}<td><input type="number" min="0" value="${v}" data-sk="${esc(k)}" aria-label="Stock talla ${esc(k)}"><td><button class="btn s sm" data-rm="${esc(k)}">Quitar</button></tr>`).join('')}</table><div class="row" style="margin-top:8px"><input id="ns" placeholder="Nueva talla"><button class="btn s" id="as">Agregar talla</button></div>`:`<label>Stock general<input type="number" min="0" id="gs" value="${ed.stock||0}"></label>`);
$('#hs').onchange=e=>{ed.sizes=e.target.checked?{S:0,M:0,L:0}:null;dirty=true;szr()};

function openPv(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="phone">${pview(ed,true)}</div><button class="btn">Cerrar vista previa</button>`;document.body.append(m);bindGal(m);$('.btn',m).onclick=()=>m.remove()}

addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const AK='tienda-admin-auth';
function authed(){try{const a=JSON.parse(sessionStorage.getItem(AK));return !!(a&&a.exp>Date.now())}catch(e){return false}}
function loginView(err){return `<h1>Acceso al panel</h1><div class="note">Este código solo controla quién ve esta pantalla del prototipo; no protege por sí solo los datos en Supabase.</div><form onsubmit="return doLogin(this)"><label>Código de acceso<input name="code" type="password" required autofocus></label>${err?'<p style="color:var(--rd)">Código incorrecto.</p>':''}<button class="btn" id="lb">Entrar</button></form>`}
async function doLogin(f){const lb=$('#lb');lb.disabled=true;lb.textContent='Entrando…';
try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:f.code.value})});
if(r.ok){const j=await r.json();sessionStorage.setItem(AK,JSON.stringify({exp:j.exp}));render()}else{$('#app').innerHTML=loginView(true)}}
catch(e){lb.disabled=false;lb.textContent='Entrar';toast('No se pudo verificar el código')}
return false}
function logout(){sessionStorage.removeItem(AK);go('#/admin');render()}
function render(){const [pt,qs]=(location.hash.slice(1)||'/').split('?'),r=pt.split('/').filter(Boolean),q=new URLSearchParams(qs||''),app=$('#app');
if(r[0]!=='admin'){let h,after;const p=S.p.find(x=>x.id===r[1]);
if(!r[0])h=home();else if(r[0]==='catalogo')h=catalog(q);else if(r[0]==='producto'){h=pview(p);after=()=>{if(p&&p.status==='published'){bindGal(app);bindProd(app,p)}}}

else{if(!authed()){app.innerHTML=loginView(false);scrollTo(0,0);return}
const s=r[1]||'pedidos';let h,after;
if(s==='pedidos')h=orders();else if(s==='pedido')h=order(r[2]);else if(s==='productos')h=products();else if(s==='producto'){h=editor(r[2]||'nuevo');after=bindEd}else if(s==='inventario')h=inv();else if(s==='ajustes')h=sets();else h='<p>Página no encontrada.</p>';
app.innerHTML=adminShell(s==='pedido'?'pedidos':s==='producto'?'productos':s,h);after&&after()}
scrollTo(0,0)}
addEventListener('hashchange',()=>{if(location.hash===cur)return;if(dirty&&!confirm('Hay cambios sin guardar. ¿Descartarlos?')){location.hash=cur;return}dirty=false;cur=location.hash;render()});
if(/\/admin\/?$/.test(location.pathname)&&!location.hash)location.hash='#/admin';
cur=location.hash;$('#app').innerHTML='<p class="mu">Cargando…</p>';load().then(render).catch(()=>{$('#app').innerHTML='<p>No se pudo conectar con Supabase. <a href="" onclick="location.reload();return false">Reintentar</a></p>'});
</script></body></html>
